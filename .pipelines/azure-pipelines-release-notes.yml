# Publish the SONiC release notes to PhynetTSG

schedules:
- cron: "0 8 * * *"
  displayName: Daily build
  branches:
    include:
    - internal
  always: false
trigger: none
pr: none
resources:
  repositories:
  - repository: PhynetTSG
    type: git
    name: PhyNet/PhynetTSG
    ref: PhynetTSG

name: $(TeamProject)_$(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

pool: sonic-image-builder-1ES

parameters:
- name: 'tags'
  type: object
  default: []

variables:
  DEFAULT_BRANCH_REGEX: "internal-202[2-9][0-9][0-9]"
  DEFAULT_TAG_REGEX: "202[2-9][0-9]{3}\.[\d]{1,3}"

stages:
- stage: Build
  jobs:
  - job: Publish
    steps:
    - checkout: PhynetTSG
    - task: ADXQuery@1
      inputs:
        targetType: 'inline'
        script: |
          print A="Hello"
        kustoUrls: 'https://sonic.westus2.kusto.windows.net:443?DatabaseName=internal'
        customAuth: true
        connectedServiceName: 'SONiCDataExplorer'
        minThreshold: '0'
        maxThreshold: '0'
        OutputFile: 'release_notes.json'
