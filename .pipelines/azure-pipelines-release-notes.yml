# Publish the SONiC release notes to PhynetTSG

schedules:
- cron: "0 8 * * *"
  displayName: Daily build
  branches:
    include:
    - internal
  always: false
trigger: none
pr: none
resources:
  repositories:
  - repository: PhynetTSG
    type: git
    name: PhyNet/PhynetTSG
    ref: PhynetTSG

name: $(TeamProject)_$(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

pool:
  vmImage: 'ubuntu-20.04'

parameters:
- name: 'tags'
  type: object
  default: []

variables:
  DEFAULT_BRANCH_REGEX: "internal-202[2-9][0-9][0-9]"
  DEFAULT_TAG_REGEX: '202[2-9][0-9]{3}\.[0-9]{1,3}'

stages:
- stage: Build
  jobs:
  - job: Publish
    steps:
    - checkout: self
      fetchTags: true
      persistCredentials: true
    - checkout: PhynetTSG
      persistCredentials: true
    - task: ADXQuery@1
      inputs:
        targetType: 'inline'
        script: |
          print A="Hello";
          print B="Hello";
        kustoUrls: 'https://sonic.westus2.kusto.windows.net:443?DatabaseName=internal'
        customAuth: true
        connectedServiceName: 'SONiCDataExplorer'
        minThreshold: '0'
        maxThreshold: '100'
        OutputFile: 'release_notes.json'
    - script: |
        ls -lt
        cat release_notes.json
        cd Networking-acs-buildimage
        git checkout -b dev/pipelines/release-notes-t1
        git push --set-upstream origin dev/pipelines/release-notes-t1  -f
      displayName: "List files"
